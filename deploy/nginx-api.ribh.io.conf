# cli-solanize — public entry for the api0 gateway (same pattern as api.cvenom.com)
#
# cli-solanize stays bound to 127.0.0.1:9876; this proxy is the only way in from
# outside, so api0 can call it whether it runs on this VPS or elsewhere.
# Every /solana route except /health still requires either the internal secret
# or api0's Google OIDC token (see src/oidc.rs), so exposing it is safe.
#
# Install:
#   sudo cp nginx-api.ribh.io.conf /etc/nginx/sites-available/solanize-api
#   sudo ln -sf /etc/nginx/sites-available/solanize-api /etc/nginx/sites-enabled/solanize-api
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.ribh.io --redirect
#
# Requires a DNS A record api.ribh.io → this VPS.

# Own zones, like every other site on the VPS (names must be unique across sites).
limit_req_zone $binary_remote_addr zone=solanize_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=solanize_api_conn:10m;

server {
    listen 80;
    server_name api.ribh.io;

    access_log /var/log/nginx/solanize_api_access.log;
    error_log /var/log/nginx/solanize_api_error.log;

    # Only the Solana API is published; nothing else on this host is reachable here.
    location /solana/ {
        limit_req zone=solanize_api burst=40 nodelay;
        limit_conn solanize_api_conn 50;

        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:9876;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        # Jupiter quotes and RPC calls can be slow; api0's tool timeout is the real bound.
        proxy_read_timeout 60s;

        client_max_body_size 256k;

        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
